<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV & AI Career Intelligence Studio</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
    <style>
        :root {
            --bg: #f4f7fb;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --emerald: #059669;
            --emerald-soft: #ecfdf5;
            --amber: #d97706;
            --amber-soft: #fffbeb;
            --rose: #e11d48;
            --rose-soft: #fff1f2;
            --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 12px 28px -6px rgba(79, 70, 229, 0.12), 0 4px 10px -2px rgba(15, 23, 42, 0.04);
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at 12% 8%, rgba(79, 70, 229, 0.07) 0%, transparent 38%),
                radial-gradient(circle at 88% 12%, rgba(16, 185, 129, 0.07) 0%, transparent 36%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        @keyframes pulseRing {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.65);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 9px rgba(16, 185, 129, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(8px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 2.25rem 1.25rem 4rem;
        }

        .topbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1.25rem 1.5rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.5rem;
            animation: fadeSlideUp 0.45s ease-out;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .live-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--emerald);
            animation: pulseRing 2.2s infinite;
        }

        .brand p {
            margin: 0.25rem 0 0;
            color: var(--muted);
            font-size: 0.875rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
            border: none;
            padding: 0.7rem 1.25rem;
            border-radius: 11px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.32);
        }

        .btn-soft {
            background: var(--primary-soft);
            color: var(--primary);
            border: 1px solid rgba(79, 70, 229, 0.16);
            padding: 0.45rem 0.85rem;
            border-radius: 9px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .btn-soft:hover {
            background: var(--primary);
            color: #fff;
        }

        .btn-dismiss {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 0.4rem 0.62rem;
            border-radius: 9px;
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-dismiss:hover {
            background: var(--rose-soft);
            color: var(--rose);
            border-color: rgba(225, 29, 72, 0.3);
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .kpi {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.15rem 1.35rem;
            box-shadow: var(--shadow-sm);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
            animation: fadeSlideUp 0.5s ease-out backwards;
        }

        .kpi:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .kpi-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
        }

        .kpi-val {
            font-size: 1.85rem;
            font-weight: 800;
            margin-top: 0.3rem;
            letter-spacing: -0.03em;
        }

        /* Mode Tabs */
        .mode-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }

        .tab-group {
            display: flex;
            gap: 0.5rem;
        }

        .mode-tab {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 0.55rem 1rem;
            border-radius: 11px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .mode-tab.active {
            background: var(--text);
            color: #fff;
            border-color: var(--text);
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1rem 1.2rem;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 1.35rem;
            align-items: center;
        }

        input[type="text"],
        select {
            background: var(--surface-soft);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem 0.85rem;
            border-radius: 10px;
            font-size: 0.875rem;
            outline: none;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        input[type="text"] {
            flex: 1;
            min-width: 220px;
        }

        .pills {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .pill {
            background: var(--surface-soft);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 0.42rem 0.85rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .pill:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .pill.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .job-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .job-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.15rem 1.35rem;
            box-shadow: var(--shadow-sm);
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
            animation: fadeSlideUp 0.4s ease-out backwards;
        }

        .job-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: #cbd5e1;
        }

        .job-card.applied {
            border-left: 4px solid var(--emerald);
        }

        .card-main {
            display: grid;
            grid-template-columns: 74px 1fr auto;
            gap: 1rem;
            align-items: center;
        }

        @media (max-width: 720px) {
            .card-main {
                grid-template-columns: 64px 1fr;
            }

            .card-actions {
                grid-column: 1 / -1;
                justify-content: flex-end;
            }
        }

        .score-ring {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.15rem;
        }

        .score-ring span {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
            opacity: 0.8;
        }

        .ring-high {
            background: var(--emerald-soft);
            color: var(--emerald);
            border: 1px solid rgba(5, 150, 105, 0.25);
        }

        .ring-mid {
            background: var(--amber-soft);
            color: var(--amber);
            border: 1px solid rgba(217, 119, 6, 0.25);
        }

        .ring-low {
            background: var(--surface-soft);
            color: var(--muted);
            border: 1px solid var(--border);
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .company-name {
            font-weight: 700;
            font-size: 0.88rem;
            color: var(--primary);
        }

        .reg-tag {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.15rem 0.55rem;
            border-radius: 6px;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .role-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            display: inline-block;
        }

        .role-title:hover {
            color: var(--primary);
        }

        .loc-line {
            font-size: 0.82rem;
            color: var(--muted);
            margin-top: 0.2rem;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .check-label {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
        }

        .check-label input {
            width: 16px;
            height: 16px;
            accent-color: var(--emerald);
            cursor: pointer;
        }

        .drawer {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease, margin-top 0.3s ease;
        }

        .job-card.expanded .drawer {
            grid-template-rows: 1fr;
            margin-top: 1rem;
        }

        .drawer-inner {
            overflow: hidden;
        }

        .drawer-content {
            padding-top: 1rem;
            border-top: 1px dashed var(--border);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .audit-block h4 {
            margin: 0 0 0.4rem;
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
        }

        .chip {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.22rem 0.6rem;
            border-radius: 7px;
            margin: 0.15rem 0.25rem 0.15rem 0;
        }

        .chip-green {
            background: var(--emerald-soft);
            color: var(--emerald);
        }

        .chip-amber {
            background: var(--amber-soft);
            color: var(--amber);
        }

        .chip-rose {
            background: var(--rose-soft);
            color: var(--rose);
        }

        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(6px);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 700px;
            width: 100%;
            padding: 1.65rem;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 48px rgba(15, 23, 42, 0.18);
            animation: modalPop 0.25s ease-out;
        }

        textarea,
        input[type="password"] {
            width: 100%;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 0.7rem;
            font-size: 0.875rem;
            margin-top: 0.35rem;
            outline: none;
        }

        .result-box {
            margin-top: 1rem;
            background: var(--primary-soft);
            border: 1px solid rgba(79, 70, 229, 0.2);
            border-radius: 12px;
            padding: 1.1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="topbar">
            <div class="brand">
                <h1><span class="live-dot"></span> CV & AI Career Intelligence Studio</h1>
                <p id="updated">Syncing live ATS feeds...</p>
            </div>
            <button class="btn-primary" onclick="openModal()">✨ Audit Custom JD Against My CV</button>
        </div>

        <div class="kpis">
            <div class="kpi">
                <div class="kpi-label">Fresh Radar Roles (≤14d)</div>
                <div class="kpi-val" style="color:var(--text)" id="kpiTotal">0</div>
            </div>
            <div class="kpi">
                <div class="kpi-label">Strong CV Fit (≥ 80%)</div>
                <div class="kpi-val" style="color:var(--emerald)" id="kpiHigh">0</div>
            </div>
            <div class="kpi">
                <div class="kpi-label">UK & Remote Roles</div>
                <div class="kpi-val" style="color:var(--primary)" id="kpiUk">0</div>
            </div>
            <div class="kpi">
                <div class="kpi-label">Saved Applied Log</div>
                <div class="kpi-val" style="color:var(--amber)" id="kpiApplied">0</div>
            </div>
        </div>

        <div class="mode-tabs">
            <div class="tab-group">
                <button class="mode-tab active" id="tabFeed" onclick="switchView('feed')">📡 Fresh Radar Feed</button>
                <button class="mode-tab" id="tabApplied" onclick="switchView('applied')">✅ Applied Vault (<span
                        id="vaultCount">0</span>)</button>
            </div>
            <button class="btn-dismiss" id="resetDismissedBtn" onclick="resetDismissed()" style="display:none;">Restore
                Dismissed Roles</button>
        </div>

        <div class="toolbar">
            <input type="text" id="search" placeholder="Search role, company, location, or CV skill..." />
            <select id="companyFilter">
                <option value="">All Companies</option>
            </select>
            <div class="pills" id="regionPills">
                <button class="pill active" data-reg="ALL">All</button>
                <button class="pill" data-reg="UK">UK</button>
                <button class="pill" data-reg="Remote">Remote</button>
                <button class="pill" data-reg="EU">EU</button>
                <button class="pill" data-reg="US">US</button>
            </div>
            <label
                style="font-size:0.85rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:0.45rem;">
                Min Fit: <strong style="color:var(--primary)" id="scoreVal">65%</strong>
                <input type="range" id="minScore" min="50" max="95" value="65" style="accent-color:var(--primary)" />
            </label>
        </div>

        <div class="job-list" id="jobList"></div>
    </div>

    <!-- Custom CV + JD Audit Modal -->
    <div class="modal-backdrop" id="jdModal">
        <div class="modal">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <h2 style="margin:0;font-size:1.25rem;">Custom CV-to-JD Fit Auditor</h2>
                <button class="btn-soft" onclick="closeModal()">✕ Close</button>
            </div>
            <p style="color:var(--muted);font-size:0.85rem;margin:0.35rem 0 0.85rem;">
                Paste your CV once (stored locally in your browser) and audit any LinkedIn or external job description
                instantly.
            </p>
            <label style="font-size:0.78rem;font-weight:700;color:var(--muted);">GROQ API KEY (Browser LocalStorage
                Only)</label>
            <input type="password" id="groqKeyInput" placeholder="gsk_..." />

            <label style="font-size:0.78rem;font-weight:700;color:var(--muted);display:block;margin-top:0.75rem;">YOUR
                CV TEXT (Auto-saved in browser)</label>
            <textarea id="cvInput" style="min-height:110px;" placeholder="Paste your CV text here once..."></textarea>

            <label style="font-size:0.78rem;font-weight:700;color:var(--muted);display:block;margin-top:0.75rem;">TARGET
                JOB DESCRIPTION</label>
            <textarea id="jdInput" style="min-height:130px;"
                placeholder="Paste full job title, location, and requirements..."></textarea>

            <div style="margin-top:1rem;display:flex;justify-content:flex-end;">
                <button class="btn-primary" id="analyzeBtn" onclick="analyzeCustomJD()">Run CV Fit Audit</button>
            </div>
            <div id="jdResult"></div>
        </div>
    </div>

    <script>
        let allJobs = [];
        let activeRegion = "ALL";
        let currentView = "feed"; // 'feed' | 'applied'

        // Persistent Vault for Applied Jobs (survives even after feed refreshes or company closes role)
        let appliedVault = JSON.parse(localStorage.getItem("applied_vault") || "{}");
        let dismissedSet = new Set(JSON.parse(localStorage.getItem("dismissed_jobs") || "[]"));

        const DEFAULT_CV = `Bharath Reddy Mohan — Belfast, UK. MSc Artificial Intelligence (Ulster University, Jan 2026–May 2027) + 6 years professional experience as 3D Generalist & Technical Artist (Unity, procedural environments, shaders, pipeline automation). Stack: Python 3.12, PyTorch, OpenCV, ONNX/WASM edge inference, Grad-CAM XAI, LangGraph, FastAPI, Docker, PostgreSQL, AWS. Projects: Cutis Derm AI (multi-spectral skin lesion VLM/XAI app), ROS/Gazebo multi-robot hospital hazard detection, LedgerVi multi-agent auditing, OASIS Alzheimer's MRI research.`;

        // Client-side location guard so US/California roles never misclassify as UK
        const US_REGEX = /\b(united states|usa|u\.s\.|california|san francisco|mountain view|palo alto|sunnyvale|menlo park|new york|nyc|seattle|austin|boston|chicago|los angeles|texas|massachusetts|,\s*(ca|ny|wa|tx|ma|il|co))\b/i;
        const UK_REGEX = /\b(united kingdom|uk\b|u\.k\.|london|belfast|cambridge|oxford|edinburgh|manchester|bristol|england|scotland|wales|northern ireland)\b/i;

        function getTrueRegion(job) {
            const loc = job.location || "";
            if (US_REGEX.test(loc) && !UK_REGEX.test(loc)) return "US";
            if (UK_REGEX.test(loc) && !US_REGEX.test(loc)) return "UK";
            if (/remote/i.test(loc) && !US_REGEX.test(loc)) return "Remote";
            return job.region || "Other";
        }

        function saveStorage() {
            localStorage.setItem("applied_vault", JSON.stringify(appliedVault));
            localStorage.setItem("dismissed_jobs", JSON.stringify([...dismissedSet]));
        }

        function updateKPIs() {
            const visibleFeed = allJobs.filter(j => !dismissedSet.has(j.id));
            const appliedCount = Object.keys(appliedVault).length;
            document.getElementById("kpiTotal").textContent = visibleFeed.length;
            document.getElementById("kpiHigh").textContent = visibleFeed.filter(j => j.score >= 80).length;
            document.getElementById("kpiUk").textContent = visibleFeed.filter(j => ["UK", "Remote"].includes(getTrueRegion(j))).length;
            document.getElementById("kpiApplied").textContent = appliedCount;
            document.getElementById("vaultCount").textContent = appliedCount;
            document.getElementById("resetDismissedBtn").style.display = dismissedSet.size > 0 ? "inline-block" : "none";
        }

        function populateCompanies() {
            const sel = document.getElementById("companyFilter");
            [...new Set(allJobs.map(j => j.company))].sort().forEach(c => {
                const opt = document.createElement("option");
                opt.value = c; opt.textContent = c;
                sel.appendChild(opt);
            });
        }

        function switchView(view) {
            currentView = view;
            document.getElementById("tabFeed").classList.toggle("active", view === "feed");
            document.getElementById("tabApplied").classList.toggle("active", view === "applied");
            render();
        }

        function render() {
            const q = document.getElementById("search").value.toLowerCase();
            const comp = document.getElementById("companyFilter").value;
            const min = Number(document.getElementById("minScore").value);
            document.getElementById("scoreVal").textContent = min + "%";

            const sourceList = currentView === "applied"
                ? Object.values(appliedVault)
                : allJobs.filter(j => !dismissedSet.has(j.id) && !appliedVault[j.id]);

            const filtered = sourceList.filter(j => {
                const trueReg = getTrueRegion(j);
                if (currentView === "feed" && j.score < min) return false;
                if (comp && j.company !== comp) return false;
                if (activeRegion !== "ALL" && trueReg !== activeRegion) return false;
                if (q) {
                    const hay = `${j.company} ${j.title} ${j.location} ${(j.matched_skills || []).join(" ")}`.toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });

            const list = document.getElementById("jobList");
            if (!filtered.length) {
                list.innerHTML = `<div class="job-card" style="text-align:center;color:var(--muted);padding:2.5rem;">${currentView === "applied"
                        ? "No saved applications match this filter yet. Tick 'Applied' on any role in the Fresh Radar Feed to archive it here permanently."
                        : "No fresh roles match your current filter criteria. Try lowering the Min Fit slider or selecting 'All' regions."
                    }</div>`;
                return;
            }

            list.innerHTML = filtered.map((j, idx) => {
                const isApplied = Boolean(appliedVault[j.id]);
                const trueReg = getTrueRegion(j);
                const ringCls = j.score >= 80 ? "ring-high" : (j.score >= 65 ? "ring-mid" : "ring-low");
                const skillsHtml = (j.matched_skills || []).map(s => `<span class="chip chip-green">✓ ${s}</span>`).join("") || "<span style='color:var(--muted);font-size:0.82rem'>Pending next scan</span>";
                const gapsHtml = (j.missing_gaps || []).map(g => `<span class="chip chip-amber">△ ${g}</span>`).join("") || "<span style='color:var(--muted);font-size:0.82rem'>No major gaps</span>";
                const flagsHtml = (j.red_flags || []).map(f => `<span class="chip chip-rose">! ${f}</span>`).join("");

                return `
          <div class="job-card ${isApplied ? "applied" : ""}" id="card_${j.id}" style="animation-delay:${Math.min(idx * 0.03, 0.35)}s">
            <div class="card-main">
              <div class="score-ring ${ringCls}">${j.score}%<span>FIT</span></div>
              <div>
                <div class="meta-row">
                  <span class="company-name">${j.company}</span>
                  <span class="reg-tag">${trueReg}</span>
                  ${isApplied && j.applied_at ? `<span class="chip chip-green" style="margin:0;padding:0.1rem 0.5rem;">Applied ${j.applied_at}</span>` : ""}
                </div>
                <a class="role-title" href="${j.url}" target="_blank" rel="noopener">${j.title} ↗</a>
                <div class="loc-line">📍 ${j.location || "See posting"} · Seen ${j.date}</div>
              </div>
              <div class="card-actions">
                <button class="btn-soft" onclick="toggleCard('${j.id}')">Inspect CV Fit</button>
                <label class="check-label">
                  <input type="checkbox" ${isApplied ? "checked" : ""} onchange="toggleApplied('${j.id}')" /> Applied
                </label>
                ${!isApplied ? `<button class="btn-dismiss" title="Not interested — hide role" onclick="dismissJob('${j.id}')">✕</button>` : ""}
              </div>
            </div>
            <div class="drawer">
              <div class="drawer-inner">
                <div class="drawer-content">
                  <div class="audit-block">
                    <h4>CV Fit Rationale</h4>
                    <p style="margin:0;font-size:0.86rem;line-height:1.55;">${j.summary || "Run workflow once to populate CV rationale."}</p>
                  </div>
                  <div class="audit-block">
                    <h4>Matched CV Strengths</h4>
                    <div>${skillsHtml}</div>
                  </div>
                  <div class="audit-block">
                    <h4>Gaps & Flags</h4>
                    <div>${gapsHtml} ${flagsHtml}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>`;
            }).join("");
        }

        function toggleCard(id) { document.getElementById("card_" + id).classList.toggle("expanded"); }

        function toggleApplied(id) {
            if (appliedVault[id]) {
                delete appliedVault[id];
            } else {
                const job = allJobs.find(j => j.id === id);
                if (job) {
                    appliedVault[id] = { ...job, applied_at: new Date().toISOString().slice(0, 10) };
                }
            }
            saveStorage();
            updateKPIs();
            render();
        }

        function dismissJob(id) {
            dismissedSet.add(id);
            saveStorage();
            updateKPIs();
            render();
        }

        function resetDismissed() {
            dismissedSet.clear();
            saveStorage();
            updateKPIs();
            render();
        }

        document.querySelectorAll("#regionPills .pill").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll("#regionPills .pill").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                activeRegion = btn.dataset.reg;
                render();
            });
        });

        ["search", "companyFilter", "minScore"].forEach(id =>
            document.getElementById(id).addEventListener("input", render)
        );

        function openModal() {
            document.getElementById("groqKeyInput").value = localStorage.getItem("groq_api_key") || "";
            document.getElementById("cvInput").value = localStorage.getItem("custom_cv_text") || DEFAULT_CV;
            document.getElementById("jdModal").classList.add("open");
        }
        function closeModal() { document.getElementById("jdModal").classList.remove("open"); }

        async function analyzeCustomJD() {
            const key = document.getElementById("groqKeyInput").value.trim();
            const cv = document.getElementById("cvInput").value.trim();
            const jd = document.getElementById("jdInput").value.trim();
            const resBox = document.getElementById("jdResult");
            if (!key || !jd) { resBox.innerHTML = "<p style='color:var(--rose);font-weight:600'>Please provide both your Groq API key and a Job Description.</p>"; return; }
            localStorage.setItem("groq_api_key", key);
            if (cv) localStorage.setItem("custom_cv_text", cv);

            const btn = document.getElementById("analyzeBtn");
            btn.disabled = true; btn.textContent = "Auditing CV Fit...";

            try {
                const resp = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${key}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-20b",
                        response_format: { type: "json_object" },
                        temperature: 0.1,
                        messages: [{
                            role: "user",
                            content: `Audit candidate CV fit for this JD. Return JSON: {"fit_score": int(0-100), "verdict": str, "matched_strengths": [str], "gaps_to_address": [str], "tailored_cv_pitch": str (2 sentences positioning candidate's CV for this role)}.\n\nCandidate CV:\n${(cv || DEFAULT_CV).slice(0, 4000)}\n\nJD:\n${jd.slice(0, 4000)}`
                        }]
                    })
                });
                const data = await resp.json();
                const parsed = JSON.parse(data.choices[0].message.content);
                resBox.innerHTML = `
          <div class="result-box">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
              <strong style="font-size:1.1rem;">CV Fit Score: <span style="color:var(--emerald)">${parsed.fit_score}%</span></strong>
              <span class="reg-tag">${parsed.verdict}</span>
            </div>
            <p style="font-size:0.86rem;margin:0.35rem 0;"><strong>Matched CV Strengths:</strong> ${(parsed.matched_strengths || []).join(" · ")}</p>
            <p style="font-size:0.86rem;margin:0.35rem 0;color:var(--amber);"><strong>Gaps to Prep:</strong> ${(parsed.gaps_to_address || []).join(" · ") || "None"}</p>
            <p style="font-size:0.86rem;margin:0.65rem 0 0;padding-top:0.65rem;border-top:1px solid rgba(79,70,229,0.18);color:var(--primary);"><strong>Tailored Cover/Resume Pitch:</strong> ${parsed.tailored_cv_pitch}</p>
          </div>`;
            } catch (e) {
                resBox.innerHTML = `<p style="color:var(--rose)">Error: ${e.message}</p>`;
            } finally {
                btn.disabled = false; btn.textContent = "Run CV Fit Audit";
            }
        }

        fetch("./jobs.json?t=" + Date.now())
            .then(r => r.json())
            .then(data => {
                allJobs = data.jobs || [];
                document.getElementById("updated").textContent = `Last synced: ${data.updated_at} · Auto-prunes unapplied roles > 14 days`;
                updateKPIs();
                populateCompanies();
                render();
            })
            .catch(() => {
                document.getElementById("updated").textContent = "Run GitHub workflow once to populate jobs.json.";
            });
    </script>
</body>

</html>
