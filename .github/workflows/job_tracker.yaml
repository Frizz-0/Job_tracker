name: CV & AI Job Radar

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  track-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code from main
        uses: actions/checkout@v7

      - name: Restore state from data branch
        run: |
          git fetch origin data || true
          git checkout origin/data -- jobs.db jobs.json JOBS.md 2>/dev/null || true

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run ATS poller & Groq CV auditor
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -u tracker.py

      - name: Push updated state to data branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -B data
          for f in jobs.db jobs.json JOBS.md; do
            [ -f "$f" ] && git add -f "$f"
          done
          if ! git diff --staged --quiet; then
            git commit -m "chore: update job data"
            git push -f origin data
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: track-jobs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4